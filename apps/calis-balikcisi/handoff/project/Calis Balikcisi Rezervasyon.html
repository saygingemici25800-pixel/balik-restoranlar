<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Çalış Balıkçısı — Rezervasyon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* gentle ambient breathing for the sun (per ambient toggle) */
    .ambient-sun { transform-origin: -300px -130px; animation: sunBreathe 6s ease-in-out infinite; }
    @keyframes sunBreathe {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: .92; }
    }
    .ambient-sea path { animation: seaWave 7s ease-in-out infinite; }
    .ambient-sea path:nth-child(2) { animation-delay: -2s; }
    .ambient-sea path:nth-child(3) { animation-delay: -4s; }
    @keyframes seaWave {
      0%,100% { transform: translateX(0); }
      50% { transform: translateX(-6px); }
    }
    .tbl { transition: transform .2s ease, filter .2s; cursor: pointer; transform-box: fill-box; transform-origin: center; }
    .tbl.taken { cursor: not-allowed; }
    .tbl:not(.taken):hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script type="text/babel" src="iso-map.jsx"></script>
  <script type="text/babel" src="reservation-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
